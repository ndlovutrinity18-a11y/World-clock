<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="src/style.css">
<script src="https://cdn.jsdelivr.net/npm/moment@2.30.1/moment.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/moment-timezone-all@0.5.5/builds/moment-timezone-with-data.min.js"></script>
    <title> World clock: Trinity</title>
</head>
<body>
    <div id="container">
 <h1>
  World clock  
 </h1>
 <label for="city">Choose a city:</label>
 <select id="city">
    <option value="0">Select a city</option>
    <option value="Johannesburg">Johannesburg</option>
    <option value="New York">New York</option>
    <option value="London">London</option>
    <option value="Tokyo">Tokyo</option>
    <option value="Sydney">Sydney</option>
    <option value="Moscow">Moscow</option>
 </select>
 <div class="city">
    <h2 id="Jozi">Johannesburg</h2>
    <div class="time-info">
    <span id="date-1"></span>
    <span id="time-1"></span>
    <span id="timezone-1">UTC+2</span>
 </div>
</div>
<div class="city">
    <h2 id="Japan">Tokyo</h2>
    <div class="time-info">
    <span id="date-2"></span>
    <span id="time-2"></span>
    <span id="timezone-2">UTC+9</span>
 </div>
</div>
<div class="city">
    <h2 id="America">New York</h2>
    <div class="time-info">
    <span id="date-3"></span>
    <span id="time-3"></span>
    <span id="timezone-3">UTC-5</span>
 </div>
</div>
</div>
    <footer>
This project was coded with ♥ by <a href="https://github.com/ndlovutrinity18-a11y" target="_blank" rel="noopener"> Trinity</a> and is open sourced on <a href="https://github.com/ndlovutrinity18-a11y/World-clock" target="_blank" rel="noopener"> GitHub</a>
    </footer> 
</body>
<script src="src/index.js"></script>
</html>

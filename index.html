<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="src/style.css">
    <title> World clock: Trinity</title>
</head>
<body>
    <div id="container">
 <h1>
  World clock  
 </h1>
 <label for="city">Choose a city:</label>
 <select id="city">
    <option value="0">Select a city</option>
    <option value="Johannesburg">Johannesburg</option>
    <option value="New York">New York</option>
    <option value="London">London</option>
    <option value="Tokyo">Tokyo</option>
    <option value="Sydney">Sydney</option>
    <option value="Moscow">Moscow</option>
 </select>
 <div class="city">
    <h2 id="city-name">Johannesburg</h2>
    <div class="time-info">
    <span id="date-1">November 4th, 2025</span>
    <span id="time-1">11:14am</span>
    <span id="timezone-1">UTC+2</span>
 </div>
</div>
<div class="city">
    <h2 id="city-name">Tokyo</h2>
    <div class="time-info">
    <span id="date-2">November 4th, 2025</span>
    <span id="time-2">19:14pm</span>
    <span id="timezone-2">UTC+9</span>
 </div>
</div>
<div class="city">
    <h2 id="city-name">New York</h2>
    <div class="time-info">
    <span id="date-3">November 4th, 2025</span>
    <span id="time-3">03:14am</span>
    <span id="timezone-3">UTC-5</span>
 </div>
</div>
</div>
    <footer>
This project was coded by <a href="" target="_blank"> Trinity</a> and is hosted on <a href="h" target="_blank"> GitHub</a>
    </footer> 
</body>
<script src="src/index.js"></script>
</html>
